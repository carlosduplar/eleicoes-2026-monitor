name: Curate (Editor-chefe)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0-3,8-23 * * *"

permissions:
  contents: write

concurrency:
  group: repo-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      POOLSIDE_API_KEY: ${{ secrets.POOLSIDE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      AI_PREFLIGHT_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "action@github.com"
          git pull --rebase --autostash origin master || (git rebase --abort && echo "Pull failed, continuing with current state")

      - name: Curate content
        continue-on-error: true
        run: python -m scripts.curate

      - name: Commit curated outputs
        uses: ./.github/actions/bot-data-sync
        with:
          workflow_name: curator
          strategy: rebase
          on_rebase_conflict: abort
          add_paths: |
            site/public/data/articles.json
            site/public/data/curated_feed.json
            site/public/data/weekly_briefing.json
            site/public/data/quiz.json
            state/.curate_last_run
            state/editor_feedback.json
          commit_message: "chore(ci): editor-chefe curation update"
