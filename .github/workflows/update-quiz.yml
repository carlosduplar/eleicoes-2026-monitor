name: Update Quiz Positions
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
concurrency:
  group: repo-write-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Pull latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "action@github.com"
          git pull --rebase --autostash origin master || (git rebase --abort && echo "Pull failed, continuing with current state")
      - name: Extract positions
        env:
          POOLSIDE_API_KEY: ${{ secrets.POOLSIDE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_PREFLIGHT_ENABLED: "true"
        run: python -m scripts.generate_quiz
      - name: Record sync date
        run: echo "QUIZ_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Commit quiz data
        uses: ./.github/actions/bot-data-sync
        with:
          workflow_name: quiz
          strategy: rebase
          on_rebase_conflict: abort
          add_paths: |
            site/public/data/quiz.json
          commit_message: "chore: update quiz ${{ env.QUIZ_DATE }}"
