name: Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: repo-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "action@github.com"
          git pull --rebase --autostash origin master || (git rebase --abort && echo "Pull failed, continuing with current state")

      - name: Run watchdog
        run: python scripts/watchdog.py

      - name: Commit watchdog output
        uses: ./.github/actions/bot-data-sync
        with:
          workflow_name: watchdog
          strategy: rebase
          on_rebase_conflict: abort
          add_paths: |
            site/public/data/pipeline_health.json
            state/sync_log.jsonl
          commit_message: "chore(ci): watchdog pipeline health update"
