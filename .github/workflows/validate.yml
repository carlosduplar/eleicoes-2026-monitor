name: Validate (Editor)

on:
  workflow_dispatch:
  push:
    paths:
      - "site/public/data/**"
  schedule:
    - cron: "*/30 0-3,8-23 * * *"

permissions:
  contents: write

concurrency:
  group: repo-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      POOLSIDE_API_KEY: ${{ secrets.POOLSIDE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "action@github.com"
          git pull --rebase --autostash origin master || (git rebase --abort && echo "Pull failed, continuing with current state")

      - name: Validate raw articles with AI
        run: |
          python scripts/summarize.py
          python scripts/analyze_sentiment.py
          python scripts/build_data.py

      - name: Commit validated outputs
        uses: ./.github/actions/bot-data-sync
        with:
          workflow_name: editor
          strategy: rebase
          on_rebase_conflict: theirs
          add_paths: |
            site/public/data/articles.json
            site/public/data/sentiment.json
            state/editor_feedback.json
          commit_message: "chore(ci): editor validated pipeline output"
          discard_paths: |
            site/public/data/articles.json
            site/public/data/sentiment.json
            state/editor_feedback.json
